---
# tasks file for iis2_deploy - RHEL/CentOS/Fedora specific

- name: Update package lists (RHEL/CentOS/Fedora)
  ansible.builtin.dnf:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - prerequisites
    - packages

- name: Install Apache and required modules (RHEL/CentOS/Fedora)
  ansible.builtin.dnf:
    name:
      - httpd
      - "{{ iis2_apache_rhel_modules | map('selectattr('name', 'in', iis2_apache_rhel_modules))' | list }" + "/default"
    state: present
  tags:
    - install
    - apache

- name: Ensure Apache user and group exist (RHEL/CentOS/Fedora)
  ansible.builtin.user:
    name: "{{ iis2_apache_user }}"
    groups: "{{ iis2_apache_group }}"
    state: present
    shell: /bin/bash
  tags:
    - apache
    - user

- name: Ensure Apache group exists (RHEL/CentOS/Fedora)
  ansible.builtin.group:
    name: "{{ iis2_apache_group }}"
    state: present
  tags:
    - apache
    - group