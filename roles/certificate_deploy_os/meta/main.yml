---
# meta/main.yml - Certificate Deploy OS Role Metadata

- name: Galaxy metadata
  galaxy_info:
    author: A&ECoding
    description: >
      Ansible role to deploy SSL certificates on Debian, Red Hat,
      AIX, and Windows servers. Supports automatic certificate
      generation and deployment from template files.
    license: MIT
    min_ansible_version: '2.14'
    platforms:
      - debian
        versions:
          - 'bullseye'
          - 'bookworm'
          - 'trixie'
      - ubuntu
        versions:
          - 'focal'
          - 'jammy'
          - 'noble'
      - redhat
        versions:
          - '7'
          - '8'
          - '9'
      - windows
        versions:
          - '2016'
          - '2019'
          - '2022'
    galaxy_tags:
      - certificates
      - ssl
      - tls
      - security
      - nginx
      - apache
      - iis
