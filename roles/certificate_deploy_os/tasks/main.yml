---
# tasks/main.yml - Certificate Deploy OS Role
# Main entry point with OS detection and routing

- name: Gather facts if not already done
  ansible.builtin.setup:
    gather_subset:
      - 'min'

- name: Detect OS families using native variables
  ansible.builtin.set_fact:
    is_debian_ubuntu: "{{ ansible_os_family == 'Debian' }}"
    is_windows: "{{ ansible_os_family == 'Windows' }}"

- name: Route to Debian/Ubuntu tasks
  ansible.builtin.include_tasks:
    file: tasks/linux/main.yml
  when: is_debian_ubuntu

- name: Route to Windows tasks
  ansible.builtin.include_tasks:
    file: tasks/windows/main.yml
  when: is_windows
