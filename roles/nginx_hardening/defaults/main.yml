---
# defaults/main.yml - Variables par défaut du rôle nginx_hardening

# Chemins de configuration
nginx_config_dir: /etc/nginx/sites-available
nginx_ssl_dir: /etc/nginx/ssl

# Paramètres SSL
nginx_enable_ssl: false
nginx_ssl_domains:
  - localhost

# Paramètres d'administration
nginx_admin_email: "admin@localhost"

# Port par défaut
nginx_port: 80
nginx_ssl_port: 443

# Paramètres de sécurité
nginx_hardening_enabled: true
nginx_disable_server_tokens: true
nginx_hide_version_info: true
nginx_enable_rate_limiting: false
nginx_max_requests_per_ip: 10000

# Logs
nginx_log_dir: /var/log/nginx
nginx_access_log_format: "{{ nginx_access_log_format | default('remote_addr - $remote_user [$time_local] "$request_uri" $status $body_bytes_sent "$http_referer" "$http_user_agent"") }}"
nginx_error_log_level: warn